<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexERP | Vendas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<aside class="sidebar">
    <div class="sidebar-logo">
        <h2>NexERP</h2>
        <span>Mini ERP</span>
    </div>

    <nav>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('produtos') }}">Produtos</a>
        <a href="{{ url_for('vendas') }}" class="active">Vendas</a>
        <a href="{{ url_for('historico') }}">Histórico</a>
    </nav>

    <a href="{{ url_for('logout') }}" class="logout">Sair</a>
</aside>

<main class="content">

    <div class="topbar">
        <div>
            <h1>Registrar Venda</h1>
            <p>Selecione um produto e informe a quantidade.</p>
        </div>
    </div>

    <section class="form-panel">

        {% if produtos %}

        <form method="POST" class="product-form">

            <label>Produto</label>

            <select name="produto_id" required>
                <option value="">Selecione um produto</option>

                {% for produto in produtos %}
                    <option value="{{ produto.id }}">
                        {{ produto.nome }} —
                        R$ {{ "%.2f"|format(produto.preco) }}
                        — Estoque: {{ produto.estoque }}
                    </option>
                {% endfor %}
            </select>

            <label>Quantidade</label>

            <input
                type="number"
                name="quantidade"
                min="1"
                placeholder="Ex: 2"
                required
            >

            <div class="form-actions">
                <button type="submit">
                    Registrar venda
                </button>
            </div>

        </form>

        {% else %}

        <div class="empty-state">
            <h3>Nenhum produto disponível</h3>

            <p>
                Você precisa cadastrar produtos com estoque
                antes de registrar uma venda.
            </p>

            <a
                href="{{ url_for('novo_produto') }}"
                class="primary-button"
            >
                Cadastrar produto
            </a>
        </div>

        {% endif %}

    </section>

</main>

</body>
</html>
