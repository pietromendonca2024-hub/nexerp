<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexERP | Novo Cliente</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<aside class="sidebar">
    <div class="sidebar-logo">
        <h2>NexERP</h2>
        <span>Mini ERP</span>
    </div>

    <nav>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('produtos') }}">Produtos</a>
        <a href="{{ url_for('clientes') }}" class="active">Clientes</a>
        <a href="{{ url_for('vendas') }}">Vendas</a>
        <a href="{{ url_for('historico') }}">Histórico</a>
    </nav>

    <a href="{{ url_for('logout') }}" class="logout">Sair</a>
</aside>

<main class="content">

    <div class="topbar">
        <div>
            <h1>Novo Cliente</h1>
            <p>Cadastre um cliente no sistema.</p>
        </div>
    </div>

    <section class="form-panel">

        <form method="POST" class="product-form">

            <label>Nome</label>
            <input
                type="text"
                name="nome"
                placeholder="Ex: João da Silva"
                required
            >

            <label>E-mail</label>
            <input
                type="email"
                name="email"
                placeholder="Ex: joao@email.com"
            >

            <label>Telefone</label>
            <input
                type="text"
                name="telefone"
                placeholder="Ex: (21) 99999-9999"
            >

            <div class="form-actions">
                <button type="submit">
                    Cadastrar cliente
                </button>

                <a href="{{ url_for('clientes') }}">
                    Cancelar
                </a>
            </div>

        </form>

    </section>

</main>

</body>
</html>
